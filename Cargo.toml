[package]
name = "w3abdhqtu-rs"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for Warcraft III object data: .w3a, .w3b, .w3d, .w3h, .w3q, .w3t, .w3u"
license = "CC0-1.0"

[[bin]]
name = "w3abdhqtu-rs"
path = "src/main.rs"

[lib]
name = "w3abdhqtu_rs"
path = "src/lib.rs"

[dependencies]
parser-rs = { path = "../parser-rs" }
bni-rs = { path = "../bni-rs" }
slk-rs = { path = "../slk-rs" }
